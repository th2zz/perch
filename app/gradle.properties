# JVM settings for the Gradle daemon. 2 GB keeps the build inside a modest WSL
# allocation while still doing incremental builds comfortably.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
# Non-transitive R classes keep the generated R smaller and make it obvious
# which module a resource came from.
android.nonTransitiveRClass=true

kotlin.code.style=official

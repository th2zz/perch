name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bridge-and-relay:
    name: Go (bridge & relay)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - name: Test bridge
        working-directory: bridge
        run: |
          go vet ./...
          go test -count=1 ./...

      - name: Cross-compile bridge targets
        working-directory: bridge
        run: |
          for target in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64"; do
            set -- $target
            GOOS=$1 GOARCH=$2 CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/perch-bridge
          done

      - name: Test relay
        working-directory: relay
        run: |
          go vet ./...
          go test -count=1 ./...

  terminal-page:
    name: Terminal WebView page tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run terminal page Node tests
        run: node --test scripts/terminal-page/*.test.js

  android:
    name: Android (unit tests & lint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: bridge/go.mod
          cache-dependency-path: bridge/go.sum

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Run Android unit tests and release lint
        working-directory: app
        run: ./gradlew :app:testDebugUnitTest :app:lintRelease
